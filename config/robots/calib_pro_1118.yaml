# LIMO Pro 실측 보정 (2026-11-18 실습, 일반 바닥). 로봇 번호 미기록.
# 속도: 0.6 m/s 1.5 m → 라이다 0.593 / odom 0.594 (0.3 m/s 2.5 m 측정은 왼쪽 쏠림으로 라이다 기울기 무효)
# 직진: trim 0 → +0.0207 rad(좌), -0.0207 → -0.0108(우), -0.0099 → -0.0048(우)
# 원(0.3 rad 목표, scale 0.75 적용): 좌 0.287 rad(R 0.68 m), 우 0.292 rad(R 0.66 m) → 배율 0.737/0.713, 최소 회전반경 약 0.52 m
#   (앞선 두 번은 충돌로 무효)
# 센서: /scan 10 Hz ±110° 248점, /odom 47 Hz, /odometry/filtered 30 Hz(EKF TF odom→base_link 발행, 정지 10 s 드리프트 0.1 mm), /imu 101 Hz(편향 0.0001)
# 반응 지연: odom 0.14~0.15 s
calib:
  steer_scale: 0.725
  steer_trim: -0.0065
  speed_scale: 0.99
  odom_scale: 1.0
